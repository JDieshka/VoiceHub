<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceHub - Загрузки</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px;
        }
        
        .version-info {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
        }
        
        .version-info h2 {
            color: #667eea;
            font-size: 1.3em;
            margin-bottom: 10px;
        }
        
        .version-info p {
            color: #666;
            line-height: 1.6;
        }
        
        .downloads-grid {
            display: grid;
            gap: 20px;
        }
        
        .download-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .download-card:hover {
            border-color: #667eea;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }
        
        .download-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .download-icon svg {
            width: 32px;
            height: 32px;
            fill: white;
        }
        
        .download-info {
            flex: 1;
        }
        
        .download-info h3 {
            color: #333;
            font-size: 1.2em;
            margin-bottom: 8px;
        }
        
        .download-info p {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .download-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: #999;
        }
        
        .download-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .download-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .download-button svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            border-left: 4px solid #f44;
            padding: 20px;
            border-radius: 8px;
            color: #c33;
        }
        
        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }
            
            .download-card {
                flex-direction: column;
                text-align: center;
            }
            
            .download-button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ VoiceHub</h1>
            <p>Скачайте desktop приложение для вашей платформы</p>
        </div>
        
        <div class="content">
            <div class="version-info">
                <h2>📦 Информация о версии</h2>
                <p id="version-info">Загрузка информации...</p>
            </div>
            
            <div id="downloads-container" class="downloads-grid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Загрузка списка файлов...</p>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>VoiceHub Desktop App | <a href="/">Вернуться на главную</a></p>
        </div>
    </div>
    
    <script>
        const DOWNLOADS_API = '/downloads/api/files';
        
        async function loadDownloads() {
            try {
                // Загрузка информации о версии
                const versionResponse = await fetch('/downloads/api/version');
                const versionData = await versionResponse.json();
                
                document.getElementById('version-info').innerHTML = `
                    <strong>Версия:</strong> ${versionData.version}<br>
                    <strong>Дата сборки:</strong> ${new Date(versionData.build_date).toLocaleString('ru-RU')}
                `;
                
                // Загрузка списка файлов
                const filesResponse = await fetch(DOWNLOADS_API);
                const filesData = await filesResponse.json();
                
                if (filesData.files.length === 0) {
                    document.getElementById('downloads-container').innerHTML = `
                        <div class="error">
                            <strong>⚠️ Файлы для загрузки пока недоступны</strong>
                            <p>Desktop приложение ещё не собрано. Обратитесь к администратору сервера.</p>
                        </div>
                    `;
                    return;
                }
                
                const container = document.getElementById('downloads-container');
                container.innerHTML = '';
                
                filesData.files.forEach(file => {
                    const platform = getPlatformInfo(file.name);
                    const card = createDownloadCard(file, platform);
                    container.appendChild(card);
                });
                
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                document.getElementById('downloads-container').innerHTML = `
                    <div class="error">
                        <strong>⚠️ Ошибка загрузки</strong>
                        <p>Не удалось загрузить список файлов. Попробуйте обновить страницу.</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">${error.message}</p>
                    </div>
                `;
            }
        }
        
        function getPlatformInfo(filename) {
            if (filename.endsWith('.msi') || filename.endsWith('.exe')) {
                return {
                    name: 'Windows',
                    icon: 'windows',
                    description: 'Установщик для Windows 10/11 (64-bit)'
                };
            } else if (filename.endsWith('.dmg')) {
                return {
                    name: 'macOS',
                    icon: 'apple',
                    description: 'Установщик для macOS 10.15+'
                };
            } else if (filename.endsWith('.AppImage')) {
                return {
                    name: 'Linux (AppImage)',
                    icon: 'linux',
                    description: 'Портативная версия для Linux'
                };
            } else if (filename.endsWith('.deb')) {
                return {
                    name: 'Linux (DEB)',
                    icon: 'linux',
                    description: 'Пакет для Debian/Ubuntu'
                };
            } else {
                return {
                    name: 'Файл',
                    icon: 'file',
                    description: 'Скачать файл'
                };
            }
        }
        
        function getPlatformIcon(iconName) {
            const icons = {
                windows: `<svg viewBox="0 0 24 24"><path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.9-1.801"/></svg>`,
                apple: `<svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>`,
                linux: `<svg viewBox="0 0 24 24"><path d="M12.504 0c-.155 0-.315.008-.48.021-4.226.333-3.105 4.807-3.17 6.298-.076 1.092-.3 1.953-1.05 3.02-.885 1.051-2.127 2.75-2.716 4.521-.278.832-.41 1.684-.287 2.489a.424.424 0 00-.11.135c-.26.268-.45.6-.663.839-.199.199-.485.267-.797.4-.313.136-.658.269-.864.68-.09.189-.136.394-.132.602 0 .199.027.4.055.536.058.399.116.728.04.97-.249.68-.28 1.145-.106 1.484.174.334.535.47.94.601.81.2 1.91.135 2.774.6.926.466 1.866.67 2.616.47.526-.116.97-.464 1.208-.946.587-.003 1.23-.269 2.26-.334.699-.058 1.574.266 2.577.2.025.134.063.198.114.333l.003.003c.391.778 1.113 1.132 1.884 1.074.699-.058 1.574.266 2.577.2.025.134.063.198.114.333l.003.003c.391.778 1.113 1.132 1.884 1.074.774-.065 1.256-.6 1.374-1.374.065-.269.065-.537.065-.805 0-.269-.065-.537-.065-.805-.065-.269-.132-.537-.264-.805-.264-.537-.66-1.074-1.058-1.611-.396-.537-.793-1.074-1.058-1.611-.132-.268-.198-.537-.264-.805-.065-.268-.065-.536-.065-.805 0-.268.066-.536.132-.804.065-.269.197-.537.329-.805.264-.537.662-1.074 1.059-1.611.397-.537.794-1.074 1.059-1.611.131-.268.197-.536.263-.804.065-.269.065-.537.065-.805 0-.269-.065-.537-.065-.805-.066-.269-.132-.537-.264-.805-.264-.537-.661-1.074-1.058-1.611-.397-.537-.794-1.074-1.059-1.611-.131-.268-.197-.536-.263-.804-.065-.269-.065-.537-.065-.805 0-.269.065-.537.065-.805.066-.269.132-.537.264-.805.264-.537.661-1.074 1.058-1.611.397-.537.794-1.074 1.059-1.611.131-.268.197-.536.263-.804.065-.269.065-.537.065-.805 0-.269-.065-.537-.065-.805-.066-.269-.132-.537-.264-.805-.264-.537-.661-1.074-1.058-1.611-.397-.537-.794-1.074-1.059-1.611-.131-.268-.197-.536-.263-.804-.065-.269-.065-.537-.065-.805 0-.269.065-.537.065-.805.066-.269.132-.537.264-.805.264-.537.661-1.074 1.058-1.611.397-.537.794-1.074 1.059-1.611.131-.268.197-.536.263-.804.065-.269.065-.537.065-.805 0-.269-.065-.537-.065-.805-.066-.269-.132-.537-.264-.805-.264-.537-.661-1.074-1.058-1.611z"/></svg>`,
                file: `<svg viewBox="0 0 24 24"><path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/></svg>`
            };
            return icons[iconName] || icons.file;
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        function createDownloadCard(file, platform) {
            const card = document.createElement('div');
            card.className = 'download-card';
            
            card.innerHTML = `
                <div class="download-icon">
                    ${getPlatformIcon(platform.icon)}
                </div>
                <div class="download-info">
                    <h3>${platform.name}</h3>
                    <p>${platform.description}</p>
                    <div class="download-meta">
                        <span>📦 ${formatFileSize(file.size)}</span>
                        <span>📅 ${new Date(file.date).toLocaleDateString('ru-RU')}</span>
                    </div>
                </div>
                <a href="/downloads/${file.name}" class="download-button" download>
                    <svg viewBox="0 0 24 24"><path d="M5,20H19V18H5M19,9H15V3H9V9H5L12,16L19,9Z"/></svg>
                    Скачать
                </a>
            `;
            
            return card;
        }
        
        // Загрузка при старте страницы
        loadDownloads();
        
        // Автообновление каждые 30 секунд
        setInterval(loadDownloads, 30000);
    </script>
</body>
</html>
