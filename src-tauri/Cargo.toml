[package]
name = "voicehub-desktop"
version = "2.0.0"
description = "VoiceHub - голосовые каналы и трансляции"
authors = ["VoiceHub Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6", features = [
    "shell-open",
    "system-tray",
    "global-shortcut-all",
    "notification-all",
    "window-all",
    "clipboard-all",
    "fs-all",
    "path-all",
    "process-all",
] }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
sysinfo = "0.30"
cpal = "0.15"
auto-launch = "0.5"
window-shadows = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
