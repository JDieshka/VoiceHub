version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: voicehub-db
    environment:
      POSTGRES_USER: voicehub
      POSTGRES_PASSWORD: voicehub
      POSTGRES_DB: voicehub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicehub"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: voicehub-server
    environment:
      PORT: 8080
      MODE: hybrid
      DATABASE_URL: postgres://voicehub:voicehub@postgres:5432/voicehub?sslmode=disable
      JWT_SECRET: your-super-secret-jwt-key-change-in-production-min-32-chars
      JWT_EXPIRATION_HOURS: 24
      REFRESH_EXPIRATION_DAYS: 7
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: voicehub-frontend
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
