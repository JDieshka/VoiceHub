name: Release VoiceHub Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `VoiceHub ${context.ref.replace('refs/tags/', '')}`,
              body: `## VoiceHub Desktop Release\n\nАвтоматическая сборка ${context.ref.replace('refs/tags/', '')}\n\n### Установка\n- **Windows**: Скачайте .msi или .exe файл\n\n### Системные требования\n- Windows 10/11 (64-bit)\n\n### Подключение\nПриложение автоматически подключается к серверу VoiceHub.`,
              draft: false,
              prerelease: false
            });
            return {
              id: release.data.id,
              upload_url: release.data.upload_url
            };

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1.6"

      - name: Generate icons
        run: node scripts/create-placeholder-icons.js

      - name: Build Tauri app
        run: cargo tauri build

      - name: Upload MSI
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const msiPath = path.join('src-tauri', 'target', 'release', 'bundle', 'msi');
            const files = fs.readdirSync(msiPath).filter(f => f.endsWith('.msi'));
            
            for (const file of files) {
              const filePath = path.join(msiPath, file);
              const asset = await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: '${{ needs.create-release.outputs.release_id }}',
                name: file,
                data: fs.readFileSync(filePath)
              });
            }

      - name: Upload NSIS
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const nsisPath = path.join('src-tauri', 'target', 'release', 'bundle', 'nsis');
            const files = fs.readdirSync(nsisPath).filter(f => f.endsWith('.exe'));
            
            for (const file of files) {
              const filePath = path.join(nsisPath, file);
              const asset = await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: '${{ needs.create-release.outputs.release_id }}',
                name: file,
                data: fs.readFileSync(filePath)
              });
            }
