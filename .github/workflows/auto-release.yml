name: Auto Tag & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Detected version: $VERSION"
          echo "🏷️  Tag will be: v$VERSION"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️  Tag ${{ steps.ver.outputs.tag }} already exists - skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag ${{ steps.ver.outputs.tag }} does not exist - will create release"
          fi

  build-frontend:
    name: Build Frontend
    needs: check-version
    if: needs.check-version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  build-windows:
    name: Build Windows App
    needs: check-version
    if: needs.check-version.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1.6"

      - name: Generate icons
        run: node scripts/create-placeholder-icons.js

      - name: Build Tauri app
        run: cargo tauri build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

  create-release:
    name: Create Release
    needs: [check-version, build-frontend, build-windows]
    if: needs.check-version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: windows/

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.check-version.outputs.tag }}
          git push origin ${{ needs.check-version.outputs.tag }}
          echo "✅ Created tag: ${{ needs.check-version.outputs.tag }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: VoiceHub ${{ needs.check-version.outputs.tag }}
          body: |
            ## 🎉 VoiceHub ${{ needs.check-version.outputs.tag }}
            
            Автоматический релиз версии ${{ needs.check-version.outputs.version }}
            
            ### 📥 Установка
            
            #### Windows
            - **VoiceHub_${{ needs.check-version.outputs.version }}_x64_en-US.msi** - MSI установщик (рекомендуется)
            - **VoiceHub_${{ needs.check-version.outputs.version }}_x64-setup.exe** - EXE установщик
            
            #### Веб-версия
            Скачайте и откройте `index.html` из архива `web-dist.zip` в браузере
            
            ### 🔧 Изменения
            Автоматически сгенерированы из коммитов с момента последнего релиза.
            
            ### 📋 Подключение
            Приложение автоматически подключается к серверу VoiceHub.
            
            ---
            **Полная документация:** [README.md](https://github.com/${{ github.repository }}/blob/main/README.md)
          files: |
            windows/*.msi
            windows/*.exe
            dist/**
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Summary
        run: |
          echo "## ✅ Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.check-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ needs.check-version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** https://github.com/${{ github.repository }}/releases/tag/${{ needs.check-version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
